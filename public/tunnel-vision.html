    <style>

.projectPage {
    width: 50%;
    max-width: 1200px;
    margin-left: auto;

.videoPlayer {
    position: relative;
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 16 / 9;
    margin: 30px auto;
}

.videoPlayer video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.playButton {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 80px;
    height: 80px;

    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.75);
    color: white;

    font-size: 32px;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.playButton:hover {
    background: rgba(0, 0, 0, 0.9);
}

main {
    padding-top: 2%;
}

.backButton {
    display: inline-block;
    margin-top: 30px;
    text-decoration: none;
    font-family: modesto-condensed, serif;
    color: white;

    <script>
function playVideo() {
    const video = document.getElementById("tunnelVideo");
    const button = document.querySelector(".playButton");

    video.play();
    button.style.display = "none";
}
